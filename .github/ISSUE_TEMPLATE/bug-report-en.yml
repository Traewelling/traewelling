name: "🇬🇧 Report an Software-Issue in English"
description: "Report a bug or unexpected behavior in the Traewelling software (software bug)"
body:
  - type: markdown
    attributes:
      value: |
        **Stop - Please first check if this is a data issue:**
        - 🧭 **Wrong operator:** https://github.com/Traewelling/transitous-wikidata-operator-matching/issues
        - 🗺️ **Wrong/missing schedule data (GTFS):** https://github.com/mfdz/GTFS-Issues/issues
        - 🔁 **Duplicate trips:** https://github.com/public-transport/transitous/issues

        If it’s **not** a data issue but the **Traewelling software** misbehaves, please use this form.

        Also check the [open issues](https://github.com/Traewelling/traewelling/issues) and the
        [experimental features](https://github.com/Traewelling/traewelling/issues/3660) to avoid duplicates.  
        **Note:** If experimental features are enabled, you can disable them in your settings if needed: https://traewelling.de/settings/profile

  - type: checkboxes
    id: not_data_issue
    attributes:
      label: Are you sure this is not a data issue?
      description: I confirm this is **not** an operator/GTFS/duplicate problem but a **software bug** in the Traewelling software.
      options:
        - label: Yes, this is a Traewelling software bug (not a data issue).
          required: true

  - type: input
    id: url
    attributes:
      label: Affected URL (if any)
      description: Page/view where the issue occurs.
      placeholder: "https://traewelling.de/..."

  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: What went wrong? Feel free to add screenshots (please redact personal data).
      placeholder: |
        Example:
        - "When I click 'Login', an error message appears ..."
        - "I cannot log in ..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: The more precise, the faster we can fix it.
      placeholder: |
        1) Open the page ...
        2) Click 'Login' ...
        3) ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      placeholder: "After logging in I should be redirected to the start page ..."

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Device, OS, browser + version (e.g., "Android 14, Chrome 126", "Windows 11, Firefox 129").
      placeholder: "e.g., iPhone 15, iOS 18.0, Safari"

  - type: textarea
    id: browser_logs
    attributes:
      label: Browser console / error messages (optional)
      description: If known, paste relevant output here.
      render: bash

  - type: textarea
    id: additional_info
    attributes:
      label: Additional info (optional)
      description: Anything that may help (timestamp, account name/ID **without** sensitive data, workarounds, etc.).
