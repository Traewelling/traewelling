name: "🇩🇪 Softwarefehler auf Deutsch melden"
description: "Melde einen Fehler oder ein unerwartetes Verhalten in der Software Träwelling (Software-Bug)"
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        **Stopp - Bitte zuerst prüfen, ob dein Anliegen ein Datenproblem ist:**
        - 🧭 **Falscher Betreiber (Operator):** https://github.com/Traewelling/transitous-wikidata-operator-matching/issues
        - 🗺️ **Fehlerhafte/fehlende Fahrplandaten (GTFS):** https://github.com/mfdz/GTFS-Issues/issues
        - 🔁 **Doppelte Fahrten:** https://github.com/public-transport/transitous/issues

        Wenn es **kein** Datenproblem ist, sondern die **Software Träwelling** sich falsch verhält, fülle bitte dieses Formular aus.

        Bitte prüfe außerdem die [offenen Issues](https://github.com/Traewelling/traewelling/issues) **und** die [experimentellen Features](https://github.com/Traewelling/traewelling/issues/3660), um Duplikate zu vermeiden.  
        **Hinweis:** Falls experimentelle Features aktiviert sind, kannst du sie bei Bedarf in deinen Einstellungen deaktivieren: https://traewelling.de/settings/profile

  - type: checkboxes
    id: not_data_issue
    attributes:
      label: Handelt es sich sicher nicht um ein Datenproblem?
      description: Ich bestätige, dass dies **kein** Operator-/GTFS-/Duplikat-Problem ist, sondern ein **Softwarefehler** in der Software Träwelling.
      options:
        - label: Ja, es ist ein Träwelling-Softwarefehler (kein Datenproblem).
          required: true

  - type: checkboxes
    id: no_duplicate
    attributes:
      label: Hast du nach bestehenden Issues gesucht?
      description: Bitte prüfe die [offenen Issues](https://github.com/Traewelling/traewelling/issues), ob dieses Problem bereits gemeldet wurde.
      options:
        - label: Ja, ich habe geprüft, dass es hierfür noch kein bestehendes Issue gibt.
          required: true

  - type: input
    id: url
    attributes:
      label: Betroffene URL (falls vorhanden)
      description: Seite/Ansicht, auf der der Fehler auftritt.
      placeholder: "https://traewelling.de/..."

  - type: textarea
    id: description
    attributes:
      label: Beschreibe das Problem
      description: Was funktioniert nicht? Gern Screenshots hinzufügen (bitte persönliche Daten schwärzen).
      placeholder: |
        Beispiel:
        - "Beim Klick auf 'Login' erscheint eine Fehlermeldung ..."
        - "Ich kann mich nicht anmelden ..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Schritte zum Reproduzieren
      description: Je genauer, desto schneller können wir den Fehler nachstellen.
      placeholder: |
        1) Seite öffnen ...
        2) Auf 'Login' klicken ...
        3) ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Erwartetes Verhalten
      placeholder: "Nach dem Login sollte ich zur Startseite weitergeleitet werden ..."

  - type: textarea
    id: env
    attributes:
      label: Umgebung
      description: Gerät, Betriebssystem, Browser + Version (z. B. "Android 14, Chrome 126", "Windows 11, Firefox 129").
      placeholder: "z. B. iPhone 15, iOS 18.0, Safari"

  - type: textarea
    id: browser_logs
    attributes:
      label: Browser-Konsole / Fehlermeldungen (optional)
      description: Falls bekannt, bitte relevante Ausgaben einfügen.
      render: bash

  - type: textarea
    id: additional_info
    attributes:
      label: Weitere Hinweise (optional)
      description: Alles, was hilfreich sein könnte (Zeitpunkt, Accountname/ID **ohne** sensible Daten, Workarounds, etc.).
